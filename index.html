<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차윤건 · HR SaaS 프로덕트 디자이너</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #1B1B1E; --fg: #FAFAFA; --muted: #A7A7AE; --faint: #7C7C84;
    --border: #34343A; --border2: #4A4A52; --card: #232327;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  /* 좌측 콘텐츠 가독성을 위한 좌→우 비네트 + 하단 페이드 */
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 78%, transparent) 34%, transparent 62%),
      linear-gradient(0deg, var(--bg) 0%, transparent 26%); }

  .lhead { position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 5vw, 56px); }
  .wordmark { font-size: 16px; font-weight: 800; letter-spacing: -0.03em; }
  .lnav { display: flex; align-items: center; gap: 22px; font-size: 13.5px; color: var(--muted); }
  .lnav a { transition: color .15s; } .lnav a:hover { color: var(--fg); }

  .hero { position: relative; z-index: 5; height: 100%; display: flex; align-items: center; padding: 0 clamp(20px, 5vw, 56px); }
  .hero-in { max-width: 720px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--border); background: color-mix(in srgb, var(--card) 55%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 8px 14px; border-radius: 999px; margin-bottom: 30px; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }

  .eyebrow2 { font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--faint); margin-bottom: 20px; }
  .headline { margin: 0; font-size: clamp(1.75rem, 4.4vw, 3rem); font-weight: 700; line-height: 1.26; letter-spacing: -0.035em; text-wrap: balance; }
  .sub { margin: 26px 0 0; font-size: clamp(15px, 1.7vw, 18px); line-height: 1.7; color: var(--muted); max-width: 30em; }

  .cta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 38px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 24px; border-radius: 12px; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; transition: transform .14s ease, background .15s, border-color .15s, opacity .15s; }
  .btn.primary { background: var(--fg); color: var(--bg); }
  .btn.primary:hover { transform: translateY(-2px); }
  .btn.primary span { transition: transform .18s ease; } .btn.primary:hover span { transform: translateX(4px); }
  .btn.ghost { border: 1px solid var(--border2); color: var(--fg); }
  .btn.ghost:hover { background: color-mix(in srgb, var(--card) 70%, transparent); border-color: var(--muted); }

  .foothint { position: fixed; left: clamp(20px, 5vw, 56px); bottom: 26px; z-index: 5; display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--faint); }
  .foothint .l { width: 30px; height: 1px; background: var(--border2); }

  @media (max-width: 640px) {
    .veil { background: linear-gradient(0deg, var(--bg) 6%, color-mix(in srgb, var(--bg) 60%, transparent) 46%, color-mix(in srgb, var(--bg) 30%, transparent) 100%); }
    .lnav { gap: 16px; }
    .lnav a:last-child { display: none; }
    .foothint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .badge .dot { animation: none; } }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="veil"></div>

  <header class="lhead">
    <div class="wordmark">차윤건</div>
    <nav class="lnav">
      <a href="work.html">포트폴리오</a>
      <a href="portfolio.pdf" download="차윤건_포트폴리오.pdf">이력서 PDF</a>
    </nav>
  </header>

  <main class="hero">
    <div class="hero-in">
      <div class="eyebrow2">Product Designer</div>
      <h1 class="headline">레퍼런스 체크에서 진단 플랫폼까지,<br>HR SaaS를 만들어왔습니다.</h1>
      <p class="sub">제품을 확장하고 데이터를 연결하며 하나의 HR SaaS를 키워온 프로덕트 디자이너, 차윤건입니다.</p>
      <div class="cta">
        <a class="btn primary" href="work.html">포트폴리오 보기 <span>→</span></a>
        <a class="btn ghost" href="portfolio.pdf" download="차윤건_포트폴리오.pdf">이력서 PDF ↓</a>
      </div>
    </div>
  </main>

  <div class="foothint"><span class="l"></span>2015 – 2026</div>

  <script>
  (function () {
    // ── 타일 격자 + 나선 + 고동 파형 + 마우스 토크 (Stampers hero-tile-bg 이식·모노톤화) ──
    var MONO = true; // false로 두면 청·홍(태극) 컬러
    var TW = 26, TH = 11, GAP = 9, SX = TW + GAP, SY = TH + GAP;
    var RADIUS = 160, DAMPING = 0.87, SPRING = 0.05, FORCE = 0.055;
    var TIME_SPEED = 0.018, SPIRAL = 70, OFFSET_X = 220;
    var PULSE_FREQ = 0.55, WAVE_SPEED = 2.2, WAVE_LENGTH = 55;
    var BLUE = { r: 0, g: 71, b: 160 }, RED = { r: 205, g: 46, b: 58 };

    var canvas = document.getElementById('bg');
    var ctx = canvas.getContext('2d');
    var tiles = [], time = 0, raf;
    var mouse = { x: -9999, y: -9999, vx: 0, vy: 0, inside: false };

    function build(w, h) {
      tiles = [];
      for (var y = TH / 2; y < h + SY; y += SY)
        for (var x = TW / 2; x < w + SX; x += SX)
          tiles.push({ x: x, y: y, angle: 0, vel: 0 });
    }
    function resize() {
      var w = window.innerWidth, h = window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build(w, h);
    }
    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }
    function loop() {
      var w = window.innerWidth, h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);
      time += TIME_SPEED;
      var cx = w / 2, cy = h / 2;
      var speed = Math.sqrt(mouse.vx * mouse.vx + mouse.vy * mouse.vy);
      var maxR = Math.min(cx, cy) * 0.72;

      for (var i = 0; i < tiles.length; i++) {
        var t = tiles[i];
        if (mouse.inside && speed > 0.3) {
          var mdx = t.x - mouse.x, mdy = t.y - mouse.y;
          var mdist = Math.sqrt(mdx * mdx + mdy * mdy);
          if (mdist < RADIUS) {
            var falloff = Math.pow(1 - mdist / RADIUS, 1.5);
            var cross = mouse.vx * mdy - mouse.vy * mdx;
            t.vel += Math.sign(cross) * falloff * speed * FORCE;
          }
        }
        t.vel -= t.angle * SPRING;
        t.vel *= DAMPING;
        t.angle += t.vel;

        var dx = t.x - (cx + OFFSET_X), dy = t.y - cy;
        var r = Math.sqrt(dx * dx + dy * dy);
        var theta = Math.atan2(dy, dx);
        var arm = Math.sin(theta + time - r / SPIRAL);
        var n = (arm + 1) / 2;
        var armStr = Math.pow(Math.abs(arm), 0.12);
        var act = Math.min(Math.abs(t.angle) * 0.7 + Math.abs(t.vel) * 5, 1);
        var radialFade = Math.max(0, 1 - Math.pow(r / maxR, 2));

        var envelope = Math.pow(Math.max(0, Math.sin(time * PULSE_FREQ)), 2);
        var waveRaw = Math.sin(r / WAVE_LENGTH - time * WAVE_SPEED);
        var waveFactor = Math.max(0, waveRaw) * envelope;
        var wave = waveFactor * 0.30;
        var waveScale = 1 + waveFactor * 0.45;
        var alpha = 0.10 + armStr * 0.26 * radialFade + act * 0.24 + wave;

        var R, G, B;
        if (MONO) {
          // 나선 arm → 밝기로 매핑, 외곽은 어둑한 회색으로 페이드
          var lum = 150 + 95 * n;                 // 150..245
          var edge = 78;
          var g = Math.round(edge + (lum - edge) * radialFade);
          R = g; G = g; B = Math.min(255, g + 3);
        } else {
          var cr = Math.round(RED.r + (BLUE.r - RED.r) * n);
          var cg = Math.round(RED.g + (BLUE.g - RED.g) * n);
          var cb = Math.round(RED.b + (BLUE.b - RED.b) * n);
          R = Math.round(120 + (cr - 120) * radialFade);
          G = Math.round(120 + (cg - 120) * radialFade);
          B = Math.round(140 + (cb - 140) * radialFade);
        }

        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(t.angle);
        ctx.scale(waveScale, waveScale);
        ctx.fillStyle = 'rgba(' + R + ',' + G + ',' + B + ',' + alpha.toFixed(3) + ')';
        ctx.strokeStyle = 'rgba(' + R + ',' + G + ',' + B + ',' + Math.min(alpha * 1.4, 1).toFixed(3) + ')';
        ctx.lineWidth = 0.75;
        rr(-TW / 2, -TH / 2, TW, TH, 2.5);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      mouse.vx *= 0.78; mouse.vy *= 0.78;
      raf = requestAnimationFrame(loop);
    }
    function onMove(e) {
      var nx = e.clientX, ny = e.clientY;
      if (mouse.inside) { mouse.vx = nx - mouse.x; mouse.vy = ny - mouse.y; }
      else { mouse.vx = 0; mouse.vy = 0; }
      mouse.x = nx; mouse.y = ny; mouse.inside = true;
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', onMove);
    raf = requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
